components:
  schemas:
    ActionEnum:
      enum:
      - CREATED
      - UPDATED
      - ASSIGNED
      - STATUS_CHANGED
      - PRIORITY_CHANGED
      type: string
      description: |-
        * `CREATED` - Created
        * `UPDATED` - Updated
        * `ASSIGNED` - Assigned
        * `STATUS_CHANGED` - Status Changed
        * `PRIORITY_CHANGED` - Priority Changed
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 50
        is_active:
          type: boolean
      required:
      - code
      - name
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 50
        is_active:
          type: boolean
      required:
      - code
      - name
    GuestLoginRequest:
      type: object
      description: Guest login by national_id + room number (no password).
      properties:
        national_id:
          type: string
          minLength: 1
        room_number:
          type: string
          minLength: 1
      required:
      - national_id
      - room_number
    GuestLoginResponse:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
        role:
          type: string
      required:
      - access
      - refresh
      - role
    GuestProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        national_id:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        room_number:
          type: string
          readOnly: true
      required:
      - full_name
      - id
      - national_id
      - phone
      - room_number
    OperatorAvailability:
      type: object
      description: PATCH /api/v1/operator/me/status/ — an operator toggling their
        own availability.
      properties:
        is_available:
          type: boolean
          description: Operator's own 'available / busy' toggle, shown in the reassignment
            dropdown so a colleague can be picked with the current workload in mind.
            Meaningless for GUEST/ADMIN roles.
    OperatorAvailabilityRequest:
      type: object
      description: PATCH /api/v1/operator/me/status/ — an operator toggling their
        own availability.
      properties:
        is_available:
          type: boolean
          description: Operator's own 'available / busy' toggle, shown in the reassignment
            dropdown so a colleague can be picked with the current workload in mind.
            Meaningless for GUEST/ADMIN roles.
    OperatorColleague:
      type: object
      description: |-
        Minimal representation of a fellow operator in the same department —
        just enough to populate a "reassign this ticket to..." dropdown.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        is_available:
          type: boolean
          readOnly: true
          description: Operator's own 'available / busy' toggle, shown in the reassignment
            dropdown so a colleague can be picked with the current workload in mind.
            Meaningless for GUEST/ADMIN roles.
      required:
      - id
      - is_available
      - username
    OperatorNewTicketCount:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    OperatorTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        department:
          type: integer
          readOnly: true
        department_name:
          type: string
          readOnly: true
        category:
          type: integer
          readOnly: true
        category_name:
          type: string
          readOnly: true
        room_number:
          type: string
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
        assigned_to_username:
          type: string
          readOnly: true
        resolution:
          type: string
          nullable: true
          description: Filled in by the operator when resolving the ticket.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assigned_to_username
      - category
      - category_name
      - created_at
      - department
      - department_name
      - description
      - id
      - resolved_at
      - room_number
      - title
      - updated_at
    OperatorTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/TicketStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        assigned_to:
          type: integer
          nullable: true
        resolution:
          type: string
          nullable: true
          description: Filled in by the operator when resolving the ticket.
      required:
      - description
      - title
    OperatorTokenObtainPairRequest:
      type: object
      description: |-
        Operator login: standard username + password, but only accounts with
        role OPERATOR or ADMIN are allowed to obtain a token here.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PaginatedCategoryList:
