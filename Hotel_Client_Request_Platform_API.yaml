          maxLength: 200
        description:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/TicketStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        assigned_to:
          type: integer
          nullable: true
        resolution:
          type: string
          nullable: true
          description: Filled in by the operator when resolving the ticket.
    PatchedRoomRequest:
      type: object
