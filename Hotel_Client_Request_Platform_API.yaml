          $ref: '#/components/schemas/RoomStatusEnum'
    PatchedTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        department:
          type: integer
        category:
          type: integer
    PriorityEnum:
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
