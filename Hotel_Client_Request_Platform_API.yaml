components:
  schemas:
    ActionEnum:
      enum:
      - CREATED
      - UPDATED
      - ASSIGNED
      - STATUS_CHANGED
      - PRIORITY_CHANGED
      - MERGED
      type: string
      description: |-
        * `CREATED` - Created
        * `UPDATED` - Updated
        * `ASSIGNED` - Assigned
        * `STATUS_CHANGED` - Status Changed
        * `PRIORITY_CHANGED` - Priority Changed
        * `MERGED` - Merged
    AdminStatsByDepartment:
      type: object
      description: One row of the by-department breakdown (Stage 2.4).
      properties:
        department_id:
          type: integer
        department_name:
          type: string
        open:
          type: integer
        in_progress:
          type: integer
        resolved:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer
        rating_avg:
          type: number
          format: double
          nullable: true
        rating_count:
          type: integer
      required:
      - cancelled
      - department_id
      - department_name
      - in_progress
      - open
      - rating_avg
      - rating_count
      - resolved
      - total
    AdminStatsByStatus:
      type: object
      description: Ticket count per Ticket.Status value, system-wide (Stage 2.4).
      properties:
        OPEN:
          type: integer
        IN_PROGRESS:
          type: integer
        RESOLVED:
          type: integer
        CANCELLED:
          type: integer
      required:
      - CANCELLED
      - IN_PROGRESS
      - OPEN
      - RESOLVED
    AdminStatsSummary:
      type: object
      description: |-
        GET /admin/stats/summary/ (Stage 2.4) — read-only aggregate view for
        admins: ticket counts by status/department, average resolution time
        over the last `resolution_window_days`, and the current system-wide
        overdue count (Stage 2.9 SLA).
      properties:
        by_status:
          $ref: '#/components/schemas/AdminStatsByStatus'
        by_department:
          type: array
          items:
            $ref: '#/components/schemas/AdminStatsByDepartment'
        avg_resolution_minutes:
          type: number
          format: double
          nullable: true
        overdue_count:
          type: integer
        response_overdue_count:
          type: integer
          description: Tickets still waiting for anyone to start on them, past their
            first-response target.
        avg_first_response_minutes:
          type: number
          format: double
          nullable: true
        response_sla_met_percent:
          type: number
          format: double
          nullable: true
          description: Share of due tickets started within the first-response target.
        resolution_sla_met_percent:
          type: number
          format: double
          nullable: true
          description: Share of due tickets resolved within the resolution target.
        rating_avg:
          type: number
          format: double
          nullable: true
          description: Average guest rating (1-5) in the window.
        rating_count:
          type: integer
        rating_distribution:
          type: object
          additionalProperties:
            type: integer
          description: Ratings per star, keys "1".."5".
        recent_feedback:
          type: array
          items:
            $ref: '#/components/schemas/RecentFeedback'
        resolution_window_days:
          type: integer
        generated_at:
          type: string
          format: date-time
      required:
      - avg_first_response_minutes
      - avg_resolution_minutes
      - by_department
      - by_status
      - generated_at
      - overdue_count
      - rating_avg
      - rating_count
      - rating_distribution
      - recent_feedback
      - resolution_sla_met_percent
      - resolution_window_days
      - response_overdue_count
      - response_sla_met_percent
    CannedResponse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          description: Short label shown in the picker.
        body:
          type: string
          readOnly: true
        department:
          type: integer
          readOnly: true
          nullable: true
          description: Blank = available to every department.
      required:
      - body
      - department
      - id
      - title
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        sla_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: 'Expected response time for a ticket in this category, in minutes
            (e.g. towels: 15, power outage: 10). Drives both the guest-facing "estimated
            response time" and the operator overdue highlight — there is deliberately
            only one number to configure, not a separate one for each.'
        response_sla_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: 'First-response target, in minutes: how soon an operator must
            start on a ticket (move it to IN_PROGRESS). Separate from sla_minutes
            (the resolution target): a guest mostly wants to know quickly that someone
            is on it. Capped at sla_minutes.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 50
        is_active:
          type: boolean
        sla_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: 'Expected response time for a ticket in this category, in minutes
            (e.g. towels: 15, power outage: 10). Drives both the guest-facing "estimated
            response time" and the operator overdue highlight — there is deliberately
            only one number to configure, not a separate one for each.'
        response_sla_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: 'First-response target, in minutes: how soon an operator must
            start on a ticket (move it to IN_PROGRESS). Separate from sla_minutes
            (the resolution target): a guest mostly wants to know quickly that someone
            is on it. Capped at sla_minutes.'
      required:
      - code
      - name
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 50
        is_active:
          type: boolean
      required:
      - code
      - name
    DepartmentStatsByOperator:
      type: object
      description: One operator's workload in the department summary.
      properties:
        operator_id:
          type: integer
        username:
          type: string
        is_supervisor:
          type: boolean
        active:
          type: integer
          description: Assigned tickets still OPEN or IN_PROGRESS.
        resolved_recent:
          type: integer
          description: Assigned tickets resolved within resolution_window_days.
        rating_avg:
          type: number
          format: double
          nullable: true
        rating_count:
          type: integer
      required:
      - active
      - is_supervisor
      - operator_id
      - rating_avg
      - rating_count
      - resolved_recent
      - username
    DepartmentStatsSummary:
      type: object
      description: |-
        GET /operator/stats/summary/ — the admin Stats Summary, scoped to the
        caller's own department. Same by_status / average resolution / overdue
        figures; by_department is replaced by by_operator, since a
        one-department report broken down by department would be a single row.
      properties:
        department_id:
          type: integer
        department_name:
          type: string
        by_status:
          $ref: '#/components/schemas/AdminStatsByStatus'
        by_operator:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentStatsByOperator'
        avg_resolution_minutes:
          type: number
          format: double
          nullable: true
        overdue_count:
          type: integer
        response_overdue_count:
          type: integer
          description: Tickets still waiting for anyone to start on them, past their
            first-response target.
        avg_first_response_minutes:
          type: number
          format: double
          nullable: true
        response_sla_met_percent:
          type: number
          format: double
          nullable: true
          description: Share of due tickets started within the first-response target.
        resolution_sla_met_percent:
          type: number
          format: double
          nullable: true
          description: Share of due tickets resolved within the resolution target.
        rating_avg:
          type: number
          format: double
          nullable: true
          description: Average guest rating (1-5) in the window.
        rating_count:
          type: integer
        rating_distribution:
          type: object
          additionalProperties:
            type: integer
          description: Ratings per star, keys "1".."5".
        recent_feedback:
          type: array
          items:
            $ref: '#/components/schemas/RecentFeedback'
        resolution_window_days:
          type: integer
        generated_at:
          type: string
          format: date-time
      required:
      - avg_first_response_minutes
      - avg_resolution_minutes
      - by_operator
      - by_status
      - department_id
      - department_name
      - generated_at
      - overdue_count
      - rating_avg
      - rating_count
      - rating_distribution
      - recent_feedback
      - resolution_sla_met_percent
      - resolution_window_days
      - response_overdue_count
      - response_sla_met_percent
    Extension:
      type: object
      description: |-
        Read and write in one serializer: staff read the directory, admins
        change it (see IsStaffReadAdminWrite).

        `department` is the real department's id; its name and working hours
        come back alongside, because the directory is read far more often
        than it is edited and the caller shouldn't have to join two lists to
        show one row.
      properties:
        id:
          type: integer
          readOnly: true
        extension:
          type: string
          description: 'The internal number itself. Unique: importing the same number
            again updates that row.'
          maxLength: 20
        title:
          type: string
          description: What this number is, e.g. «پذیرش».
          maxLength: 150
        person_name:
          type: string
          maxLength: 150
        department:
          type: integer
          nullable: true
        department_name:
          type: string
          readOnly: true
          default: ''
        department_working_hours:
          type: string
          readOnly: true
          default: ''
        location:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        mobile:
          type: string
          maxLength: 30
        notes:
          type: string
        is_active:
          type: boolean
          description: Off for a number that exists but is out of use; it stays in
            the directory, marked inactive.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department_name
      - department_working_hours
      - extension
      - id
      - title
      - updated_at
    ExtensionRequest:
      type: object
      description: |-
        Read and write in one serializer: staff read the directory, admins
        change it (see IsStaffReadAdminWrite).

        `department` is the real department's id; its name and working hours
        come back alongside, because the directory is read far more often
        than it is edited and the caller shouldn't have to join two lists to
        show one row.
      properties:
        extension:
          type: string
          minLength: 1
          description: 'The internal number itself. Unique: importing the same number
            again updates that row.'
          maxLength: 20
        title:
          type: string
          minLength: 1
          description: What this number is, e.g. «پذیرش».
          maxLength: 150
        person_name:
          type: string
          maxLength: 150
        department:
          type: integer
          nullable: true
        location:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        mobile:
          type: string
          maxLength: 30
        notes:
          type: string
        is_active:
          type: boolean
          description: Off for a number that exists but is out of use; it stays in
            the directory, marked inactive.
      required:
      - extension
      - title
    FrequencyEnum:
      enum:
      - NONE
      - DAILY
      - WEEKLY
      - MONTHLY
      - QUARTERLY
      - YEARLY
      type: string
      description: |-
        * `NONE` - N/A
        * `DAILY` - Daily
        * `WEEKLY` - Weekly
        * `MONTHLY` - Monthly
        * `QUARTERLY` - Quarterly
        * `YEARLY` - Yearly
