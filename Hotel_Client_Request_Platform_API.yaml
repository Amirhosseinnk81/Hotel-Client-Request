      type: object
      description: |-
        A single image attached to a ticket (Stage 2.8). `image` is the one
        writable field — the dedicated upload endpoints (guest/operator) set
        `ticket`/`uploaded_by` themselves via serializer.save(), so those two
        never need to come from the request body.
      properties:
        image:
          type: string
          format: binary
          description: Image only (jpg/jpeg/png/webp/gif), max MAX_ATTACHMENT_SIZE_MB.
          pattern: (?:jpg|jpeg|png|webp|gif)$
      required:
      - image
    TicketHistory:
      type: object
      description: |-
        A single system-generated audit entry (assignment, status/priority
        change). Rendered as one kind of row in the merged ticket timeline.
      properties:
        entry_type:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        action_display:
          type: string
          readOnly: true
        old_value:
          type: string
          readOnly: true
          nullable: true
        new_value:
          type: string
          readOnly: true
          nullable: true
        user_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - created_at
      - entry_type
      - id
      - new_value
      - old_value
      - user_username
    TicketMergeRequest:
      type: object
      description: POST /operator/tickets/{id}/merge/ — the ticket to fold this duplicate
        into.
      properties:
        into:
          type: integer
      required:
      - into
    TicketNote:
      type: object
      description: |-
        An internal note authored by an operator/admin. Rendered as the other
        kind of row in the merged ticket timeline. `text` is the only
        writable field on create — `ticket`/`author` are set by the view.
      properties:
        entry_type:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
        text:
          type: string
        author_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_username
      - created_at
      - entry_type
      - id
      - text
    TicketNoteRequest:
      type: object
      description: |-
        An internal note authored by an operator/admin. Rendered as the other
        kind of row in the merged ticket timeline. `text` is the only
        writable field on create — `ticket`/`author` are set by the view.
      properties:
        text:
          type: string
          minLength: 1
      required:
      - text
    TicketPriorityEnum:
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
      type: string
      description: |-
        * `LOW` - Low
        * `NORMAL` - Normal
        * `HIGH` - High
        * `URGENT` - Urgent
    TicketRateRequest:
      type: object
      description: POST /tickets/{id}/rate/ — write-only input, the view returns a
        TicketSerializer.
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        feedback:
          type: string
          default: ''
      required:
      - rating
    TicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        priority:
          $ref: '#/components/schemas/TicketPriorityEnum'
        department:
          type: integer
        category:
          type: integer
      required:
      - category
      - department
      - description
      - title
    TicketStatusEnum:
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      - CANCELLED
      type: string
      description: |-
        * `OPEN` - Open
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
        * `CANCELLED` - Cancelled
    TodayDashboard:
      type: object
      properties:
        date:
          type: string
          format: date
        generated_at:
          type: string
          format: date-time
        tasks_due_or_overdue:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        processes_due_or_overdue:
          type: array
          items:
            $ref: '#/components/schemas/Process'
        open_department_requests:
          type: array
          items:
            $ref: '#/components/schemas/ITDepartmentRequest'
        room_stats_today:
          $ref: '#/components/schemas/RoomStatsToday'
        my_open_tasks_count:
          type: integer
      required:
      - date
      - generated_at
      - my_open_tasks_count
      - open_department_requests
      - processes_due_or_overdue
      - room_stats_today
      - tasks_due_or_overdue
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
