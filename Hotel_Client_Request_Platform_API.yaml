        id:
          type: integer
          readOnly: true
        number:
          type: string
          maxLength: 20
        floor:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/RoomStatusEnum'
      required:
      - id
      - number
    RoomRequest:
      type: object
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 20
        floor:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/RoomStatusEnum'
      required:
      - number
    RoomStatusEnum:
      enum:
      - AVAILABLE
      - OCCUPIED
      - MAINTENANCE
      type: string
      description: |-
        * `AVAILABLE` - Available
        * `OCCUPIED` - Occupied
        * `MAINTENANCE` - Maintenance
    Ticket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        department:
          type: integer
        department_name:
          type: string
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        room_number:
          type: string
          readOnly: true
        resolution:
          type: string
          readOnly: true
          nullable: true
          description: Filled in by the operator when resolving the ticket.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - category
      - category_name
      - created_at
      - department
      - department_name
      - description
      - id
      - resolution
      - resolved_at
      - room_number
      - status
      - title
      - updated_at
    TicketHistory:
      type: object
      description: |-
        A single system-generated audit entry (assignment, status/priority
        change). Rendered as one kind of row in the merged ticket timeline.
      properties:
        entry_type:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        action_display:
          type: string
          readOnly: true
        old_value:
          type: string
          readOnly: true
          nullable: true
        new_value:
          type: string
          readOnly: true
          nullable: true
        user_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - created_at
      - entry_type
      - id
      - new_value
      - old_value
      - user_username
    TicketNote:
      type: object
      description: |-
        An internal note authored by an operator/admin. Rendered as the other
        kind of row in the merged ticket timeline. `text` is the only
        writable field on create — `ticket`/`author` are set by the view.
      properties:
        entry_type:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
        text:
          type: string
        author_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_username
      - created_at
      - entry_type
      - id
      - text
    TicketNoteRequest:
      type: object
      description: |-
        An internal note authored by an operator/admin. Rendered as the other
        kind of row in the merged ticket timeline. `text` is the only
        writable field on create — `ticket`/`author` are set by the view.
      properties:
        text:
          type: string
          minLength: 1
      required:
      - text
    TicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        department:
          type: integer
        category:
          type: integer
      required:
      - category
      - department
      - description
      - title
    TicketStatusEnum:
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      - CANCELLED
      type: string
      description: |-
        * `OPEN` - Open
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
        * `CANCELLED` - Cancelled
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT