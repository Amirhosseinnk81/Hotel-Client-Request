    get:
      operationId: api_v1_operator_tickets_overdue_count_retrieve
      description: |-
        GET /api/v1/operator/tickets/overdue-count/

        Count of currently-overdue tickets (Stage 2.9 SLA) in the operator's
        own department. is_overdue is a Python property, not a DB column (it
        depends on category.sla_minutes and "now"), so this can't be a plain
        .filter().count() — at this project's scale, loading the small set of
        still-open tickets for one department and filtering in Python is fine
        and keeps the overdue rule defined in exactly one place (Ticket model)
        instead of duplicating it as a queryset annotation. Feeds the admin
        stats view (Stage 2.4) and is available for an in-app supervisor
        warning; an actual push alert is out of scope until Stage 3.2.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOverdueCount'
          description: ''
  /api/v1/pms/events/:
    post:
      operationId: api_v1_pms_events_create
      description: |-
        POST /api/v1/pms/events/ — the hotel's PMS tells us a guest checked in,
        checked out, changed room, extended their stay, or had their details
        corrected. Authenticated with a shared key (and optionally an HMAC
        signature), never a user's JWT — see apps/pms/auth.py.

        Always answers 200 once the caller is authenticated, even for a payload
        we can't apply: the event is stored with its reason in PmsEvent, and a
        PMS must not be made to retry forever over its own bad data. The body
        says what happened, so the integration can be watched from their side.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PmsEventPayloadRequest'
            examples:
              Check-in:
                value:
                  event: check_in
                  event_id: HRS-99123
                  room_number: '305'
                  reservation_id: RSV-5512
                  occurred_at: '2026-09-24T12:05:00Z'
                  expected_check_out: '2026-09-27'
                  guest:
                    full_name: سارا احمدی
                    national_id: '0011122233'
                    phone: 09121112233
          application/x-www-form-urlencoded:
