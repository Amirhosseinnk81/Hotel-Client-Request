openapi: 3.0.3
info:
  title: Hotel Client Request Platform API
  version: 1.0.0
  description: API for managing hotel guest requests and operator workflows.
paths:
  /api/v1/admin/stats/summary/:
    get:
      operationId: api_v1_admin_stats_summary_retrieve
      description: |-
        GET /api/v1/admin/stats/summary/

        Cross-department snapshot for hotel admins (Stage 2.4): ticket counts
        by status and by department, average resolution time over the last
        30 days, and the current system-wide overdue count (Stage 2.9 SLA).
        Admin-only — IsAdminOnly, not IsAdminRole, since this exposes every
        department's data and must stay closed to operators/guests even for
        GET (unlike Category/Department/Room, which are intentionally
        readable by anyone authenticated).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsSummary'
          description: ''
  /api/v1/auth/guest/login/:
    post:
      operationId: api_v1_auth_guest_login_create
      description: |-
        POST /api/v1/auth/guest/login/

        Guest login using national_id + room_number. No password required.

        The refresh token is set as an httpOnly cookie rather than returned in
        the response body — see apps/core/jwt_cookies.py.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuestLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuestLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLoginResponse'
          description: Guest authenticated successfully.
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: |-
        POST /api/v1/auth/logout/

        Blacklists the current refresh token (so a copy of the cookie can't be
        replayed after logout) and clears the cookie. Works for both guest and
        operator sessions — logout isn't role-specific.
      tags:
      - Authentication
      responses:
        '204':
          description: Logged out.
  /api/v1/auth/operator/login/:
    post:
      operationId: api_v1_auth_operator_login_create
      description: |-
        POST /api/v1/auth/operator/login/ — username + password login for
        operators/admins.

        The refresh token is set as an httpOnly cookie rather than returned in
        the response body — see apps/core/jwt_cookies.py.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperatorTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperatorTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        POST /api/v1/auth/token/refresh/

        Reads the refresh token from the httpOnly cookie (never from the
        request body) and returns a fresh access token. Because
        ROTATE_REFRESH_TOKENS=True, the old refresh token is blacklisted and a
        new one is written back to the cookie.
      tags:
      - Authentication
      responses:
        '200':
          description: New access token issued.
        '401':
          description: Missing, invalid, or expired refresh cookie.
  /api/v1/categories/:
    get:
      operationId: api_v1_categories_list
      description: |-
        GET  /api/v1/categories/  — any authenticated user can browse.
        POST /api/v1/categories/  — admins only.

        Only active categories are exposed here — this is the endpoint the
        guest ticket-creation form reads from, so a category the admin has
        disabled must not remain selectable. Direct admin management (including
        toggling is_active) still happens through Django Admin, which queries
        the model directly and is unaffected by this filter.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: api_v1_categories_create
      description: |-
        GET  /api/v1/categories/  — any authenticated user can browse.
        POST /api/v1/categories/  — admins only.

        Only active categories are exposed here — this is the endpoint the
        guest ticket-creation form reads from, so a category the admin has
        disabled must not remain selectable. Direct admin management (including
        toggling is_active) still happens through Django Admin, which queries
        the model directly and is unaffected by this filter.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{id}/:
    get:
      operationId: api_v1_categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: api_v1_categories_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: api_v1_categories_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: api_v1_categories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/departments/:
    get:
      operationId: api_v1_departments_list
      description: |-
        GET  /api/v1/departments/  — any authenticated user (guest/operator/admin) can browse.
        POST /api/v1/departments/  — admins only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
    post:
      operationId: api_v1_departments_create
      description: |-
        GET  /api/v1/departments/  — any authenticated user (guest/operator/admin) can browse.
        POST /api/v1/departments/  — admins only.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: api_v1_departments_retrieve
      description: |-
        GET/PATCH/PUT — read for anyone authenticated, write for admins only.
        DELETE is admin-only too (blocked at the DB level anyway while
        tickets/operators reference the department, since department FKs use PROTECT).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    put:
      operationId: api_v1_departments_update
      description: |-
        GET/PATCH/PUT — read for anyone authenticated, write for admins only.
        DELETE is admin-only too (blocked at the DB level anyway while
        tickets/operators reference the department, since department FKs use PROTECT).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    patch:
      operationId: api_v1_departments_partial_update
      description: |-
        GET/PATCH/PUT — read for anyone authenticated, write for admins only.
        DELETE is admin-only too (blocked at the DB level anyway while
        tickets/operators reference the department, since department FKs use PROTECT).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    delete:
      operationId: api_v1_departments_destroy
      description: |-
        GET/PATCH/PUT — read for anyone authenticated, write for admins only.
        DELETE is admin-only too (blocked at the DB level anyway while
        tickets/operators reference the department, since department FKs use PROTECT).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/extensions/:
    get:
      operationId: api_v1_extensions_list
      description: |-
        GET: the directory, searchable with `q` or per column.
        POST: a new number (admins only).
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: ext
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: location_q
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: person
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        description: Search number, title, person, location or department
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
        description: |-
          * `active` - Active
          * `inactive` - Inactive
      - in: query
        name: title_q
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExtensionList'
          description: ''
    post:
      operationId: api_v1_extensions_create
      description: |-
        GET: the directory, searchable with `q` or per column.
        POST: a new number (admins only).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
          description: ''
  /api/v1/extensions/{id}/:
    get:
      operationId: api_v1_extensions_retrieve
      description: |-
        DELETE is a soft delete: the row goes to the trash, where Django
        Admin can restore it. A phone directory is exactly the sort of list
        somebody clears by accident.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
          description: ''
    put:
      operationId: api_v1_extensions_update
      description: |-
        DELETE is a soft delete: the row goes to the trash, where Django
        Admin can restore it. A phone directory is exactly the sort of list
        somebody clears by accident.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
          description: ''
    patch:
      operationId: api_v1_extensions_partial_update
      description: |-
        DELETE is a soft delete: the row goes to the trash, where Django
        Admin can restore it. A phone directory is exactly the sort of list
        somebody clears by accident.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExtensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExtensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExtensionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
          description: ''
    delete:
      operationId: api_v1_extensions_destroy
      description: |-
        DELETE is a soft delete: the row goes to the trash, where Django
        Admin can restore it. A phone directory is exactly the sort of list
        somebody clears by accident.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/extensions/{id}/restore/:
    post:
      operationId: api_v1_extensions_restore_create
      description: Bring one number back from the trash (admins only).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExtensionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
          description: ''
  /api/v1/extensions/export/csv/:
    get:
      operationId: api_v1_extensions_export_csv_retrieve
      description: 'Shared plumbing: same permission, same filters as the list.'
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/extensions/export/excel/:
    get:
      operationId: api_v1_extensions_export_excel_retrieve
      description: |-
        The same columns the importer reads, so an export can be edited and
        imported straight back.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/extensions/export/pdf/:
    get:
      operationId: api_v1_extensions_export_pdf_retrieve
      description: |-
        The printed phone list: landscape A4, two columns, grouped by
        department — `application/pdf`, not JSON.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Same search as the list endpoint.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/guest/hotel-info/:
    get:
      operationId: api_v1_guest_hotel_info_list
      description: |-
        GET /api/v1/guest/hotel-info/ — the help page: Wi-Fi, breakfast hours,
        check-out time... Logged-in guests only (the Wi-Fi password isn't for
        the whole internet). Unpaginated: a handful of entries.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelInfo'
          description: ''
  /api/v1/guest/profile/:
    get:
      operationId: api_v1_guest_profile_retrieve
      description: |-
        GET /api/v1/guest/profile/

        Return the authenticated guest's own profile.
      tags:
      - Guest
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestProfile'
          description: ''
        '403':
          description: User is not a guest or has no guest profile.
  /api/v1/health/:
    get:
      operationId: api_v1_health_retrieve
      description: |-
        Simple liveness endpoint — confirms the project boots and DRF routing
        works, independent of the database or any app-specific logic.
      tags:
      - System
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                required:
                - success
                - status
          description: ''
  /api/v1/iptv/rooms/{room_number}/:
    get:
      operationId: iptv_room_screen
      description: |-
        What room <room_number>'s television shows: the guest's open
        requests and the hotel's information.

        Authenticated with the `X-IPTV-Key` header, not a user's JWT — see
        apps/iptv/auth.py. An empty, unknown or idle room all answer the
        same shape, so this can't be used to find out which rooms are sold.
      parameters:
      - in: path
        name: room_number
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IptvRoomScreen'
          description: ''
  /api/v1/it-ops/department-requests/:
    get:
      operationId: api_v1_it_ops_department_requests_list
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: number
      - in: query
        name: department
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - LOW
          - MEDIUM
        description: |-
          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
          * `CRITICAL` - Critical
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - COMPLETED
          - IN_PROGRESS
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `IN_PROGRESS` - In Progress
          * `COMPLETED` - Completed
          * `REJECTED` - Rejected
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedITDepartmentRequestList'
          description: ''
    post:
      operationId: api_v1_it_ops_department_requests_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ITDepartmentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ITDepartmentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ITDepartmentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
