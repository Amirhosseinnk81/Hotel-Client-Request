    ITRequestAttachment:
      type: object
      description: |-
        One photo on a request to IT. `image` is the only writable field: the
        upload endpoint sets the request and the uploader itself, so neither
        ever comes from the body.
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
          description: Image only (jpg/jpeg/png/webp/gif), max MAX_ATTACHMENT_SIZE_MB.
          pattern: (?:jpg|jpeg|png|webp|gif)$
        uploaded_by_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
      - uploaded_by_username
    ITRequestAttachmentRequest:
      type: object
      description: |-
        One photo on a request to IT. `image` is the only writable field: the
        upload endpoint sets the request and the uploader itself, so neither
        ever comes from the body.
      properties:
        image:
          type: string
          format: binary
          description: Image only (jpg/jpeg/png/webp/gif), max MAX_ATTACHMENT_SIZE_MB.
          pattern: (?:jpg|jpeg|png|webp|gif)$
      required:
      - image
